name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system Qt6 and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Create venv and install package
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Install MLIP dependencies (Python 3.11 & 3.12)
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12'
        run: |
          uv pip install mace-torch --extra-index-url https://download.pytorch.org/whl/cpu --python .venv/bin/python

      - name: Run tests under Xvfb
        run: |
          xvfb-run -a .venv/bin/pytest tests/

  build-package:
    name: Build PyPI Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build sdist and wheel
        run: |
          uv build

      - name: Check distribution artifacts
        run: |
          ls -lh dist/
