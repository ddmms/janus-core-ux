name: Publish on PyPI

on:
  push:
    tags:
      # Match semantic version tags like v0.1.0, v1.0.0a1, etc.
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system Qt6 and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Create venv and install package
        run: |
          uv venv --python 3.12 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Run tests under Xvfb
        run: |
          xvfb-run -a .venv/bin/pytest tests/

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: release
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
      # Required for GitHub Release creation
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build distributions
        run: uv build

      - name: Get version from pyproject.toml
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.ref_name }}" != "v$VERSION" ]]; then
            echo "Git tag (${{ github.ref_name }}) does not match pyproject.toml version (v$VERSION)"
            exit 1
          fi

      - name: Check for pre-release
        id: check-prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: ${{ steps.check-prerelease.outputs.prerelease == 'true' }}
          skipIfReleaseExists: true
          generateReleaseNotes: true

      - name: Publish to PyPI
        run: uv publish
