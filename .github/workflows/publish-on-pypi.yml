name: Publish on PyPI

on:
  push:
    tags:
      # Match semantic version tags like v0.1.0, v1.0.0a1, etc.
      - v[0-9]+.[0-9]+.[0-9]+*
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0). If empty, defaults to v<version> from pyproject.toml"
        required: false
        default: ""

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system Qt6 and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Create venv and install package
        run: |
          uv venv --python 3.12 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Install MLIP dependencies
        run: |
          uv pip install mace-torch --extra-index-url https://download.pytorch.org/whl/cpu --python .venv/bin/python

      - name: Run tests under Xvfb
        run: |
          xvfb-run -a .venv/bin/pytest tests/

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: release
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
      # Required for GitHub Release creation
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build distributions
        run: uv build

      - name: Get version from pyproject.toml
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Determine tag name
        id: get-tag
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Check version matches tag
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          if [[ "$TAG" != "v$VERSION" && "$TAG" != "$VERSION" && "$TAG" != "v$VERSION-"* ]]; then
            echo "Release tag ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Check for pre-release
        id: check-prerelease
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.get-tag.outputs.tag }}
          name: ${{ steps.get-tag.outputs.tag }}
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: ${{ steps.check-prerelease.outputs.prerelease == 'true' }}
          skipIfReleaseExists: true
          generateReleaseNotes: true

      - name: Publish to PyPI
        run: uv publish
