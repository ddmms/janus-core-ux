<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Primary Sphere Gradient (Cyan/Blue) -->
    <radialGradient id="sphereGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b4befe"/>
      <stop offset="40%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>

    <!-- Secondary Sphere Gradient (Teal/Green) -->
    <radialGradient id="sphereGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="40%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>

    <!-- Accent Sphere Gradient (Peach/Coral) -->
    <radialGradient id="sphereGrad3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5e0dc"/>
      <stop offset="40%" stop-color="#fab387"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </radialGradient>

    <!-- Center Atom Gradient -->
    <radialGradient id="centerAtom" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cba6f7"/>
      <stop offset="80%" stop-color="#8839ef"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </radialGradient>

    <!-- Bond Glow -->
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="6" filter="url(#dropShadow)"/>

  <!-- Subtle Lattice / Unit Cell Orbitals -->
  <g fill="none" stroke="#45475a" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6">
    <polygon points="256,110 390,190 390,340 256,420 122,340 122,190" />
    <line x1="256" y1="110" x2="256" y2="420" />
    <line x1="122" y1="190" x2="390" y2="340" />
    <line x1="390" y1="190" x2="122" y2="340" />
  </g>

  <!-- Atomic Bonds -->
  <g stroke="url(#bondGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="160" y2="170" />
    <line x1="256" y1="256" x2="352" y2="170" />
    <line x1="256" y1="256" x2="256" y2="380" />
    <line x1="256" y1="256" x2="140" y2="310" />
    <line x1="256" y1="256" x2="372" y2="310" />
  </g>

  <!-- Outer Atoms -->
  <circle cx="160" cy="170" r="38" fill="url(#sphereGrad1)" filter="url(#dropShadow)"/>
  <circle cx="352" cy="170" r="38" fill="url(#sphereGrad2)" filter="url(#dropShadow)"/>
  <circle cx="256" cy="380" r="42" fill="url(#sphereGrad1)" filter="url(#dropShadow)"/>
  <circle cx="140" cy="310" r="34" fill="url(#sphereGrad3)" filter="url(#dropShadow)"/>
  <circle cx="372" cy="310" r="34" fill="url(#sphereGrad3)" filter="url(#dropShadow)"/>

  <!-- Center Atom (Core) -->
  <circle cx="256" cy="256" r="56" fill="url(#centerAtom)" filter="url(#dropShadow)"/>

  <!-- Specular highlights on center atom -->
  <ellipse cx="236" cy="232" rx="14" ry="9" fill="#ffffff" opacity="0.7" transform="rotate(-30 236 232)"/>
</svg>
