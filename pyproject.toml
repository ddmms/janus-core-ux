[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "janus_ux"
module-root = ""

[project]
name = "janus-core-ux"
version = "0.1.0"
description = "Modern Qt6 / PySide6 desktop UX for STFC janus-core with Chemiscope 3D visualization, interactive graphs, and multi-MLIP support"
authors = [{ name = "Janus UX Team" }]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
keywords = ["atomistic", "simulation", "mlip", "mace", "sevennet", "chemiscope", "pyside6", "qt6", "materials-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyside6>=6.8.0",
    "ase>=3.23.0",
    "janus-core>=0.9.0",
    "chemiscope>=1.0.0",
    "plotly>=5.0.0",
    "numpy",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/stfc/janus-core"
Repository = "https://github.com/stfc/janus-core"
Documentation = "https://context7.com/stfc/janus-core"

[project.scripts]
janus-core-ux = "janus_ux.main:main"

[tool.ruff]
exclude = ["conf.py", "*ipynb", "containers/assets/tutorials/*.py"]
target-version = "py311"

[tool.ruff.lint]
# Ignore complexity
ignore = ["C901"]
select = [
    # flake8-bugbear
    "B",
    # pylint
    "C", "R",
    # pydocstyle
    "D",
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F", "FA",
    # pyupgrade
    "I",
    # pep8-naming
    "N",
    # isort
    "UP",
]
[tool.ruff.lint.per-file-ignores]
'containers/*.py' = ['D100', 'E501']

[tool.ruff.lint.isort]
force-sort-within-sections = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false
